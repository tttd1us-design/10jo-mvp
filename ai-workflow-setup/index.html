<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 워크플로우 셋업 — 준비 작업 자동화</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:16px;margin-bottom:24px}
.header h1{font-size:2em;margin-bottom:10px}
.header p{font-size:1.05em;opacity:.92}
.card{background:#fff;border-radius:12px;padding:28px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h2{font-size:1.2em;margin-bottom:16px;color:#1a1a1a}
.work-type{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.work-btn{padding:16px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .2s}
.work-btn:hover{border-color:#667eea;background:#f0f4ff}
.work-btn.active{border-color:#667eea;background:#f0f4ff}
.work-btn .icon{font-size:1.8em;margin-bottom:6px}
.work-btn .label{font-weight:600;font-size:.95em}
.checklist{margin-top:16px}
.check-item{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f0f0f0}
.check-item:last-child{border-bottom:none}
.check-item input{margin-right:12px;margin-top:4px}
.check-item .text{flex:1}
.check-item .text .title{font-weight:600}
.check-item .text .desc{font-size:.85em;color:#888;margin-top:2px}
.check-item .badge{font-size:.75em;padding:2px 8px;border-radius:4px;margin-left:8px}
.badge.auto{background:#d1ecf1;color:#0c5460}
.badge.manual{background:#fff3cd;color:#856404}
.result{background:#f0f4ff;border-left:4px solid #667eea;padding:20px;border-radius:8px;margin-top:16px;display:none}
.result.show{display:block}
.result h3{color:#667eea;margin-bottom:10px}
.result pre{background:#1a1a2e;color:#a8e6cf;padding:16px;border-radius:8px;overflow-x:auto;font-size:.85em;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.btn{display:inline-block;padding:14px 32px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;margin-top:16px}
.btn:hover{background:#5a6fd6}
.footer{text-align:center;padding:30px;color:#999;font-size:.9em}
@media(max-width:768px){.work-type{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>AI 워크플로우 셋업</h1>
<p>업무 유형을 선택하면 맞춤 준비 체크리스트와 설정 파일을 자동으로 만들어드립니다</p>
</div>

<div class="card">
<h2>1. 업무 유형 선택</h2>
<div class="work-type">
<div class="work-btn active" onclick="selectType('data',this)">
<div class="icon">📊</div>
<div class="label">데이터 분석</div>
</div>
<div class="work-btn" onclick="selectType('writing',this)">
<div class="icon">✍️</div>
<div class="label">문서 작성</div>
</div>
<div class="work-btn" onclick="selectType('coding',this)">
<div class="icon">💻</div>
<div class="label">코드 생성</div>
</div>
<div class="work-btn" onclick="selectType('marketing',this)">
<div class="icon">📣</div>
<div class="label">마케팅</div>
</div>
</div>
</div>

<div class="card">
<h2>2. 준비 체크리스트</h2>
<div class="checklist" id="checklist"></div>
</div>

<div class="card">
<h2>3. 설정 파일 미리보기</h2>
<div class="result" id="result">
<h3>생성된 설정 파일</h3>
<pre id="configOutput"></pre>
<button class="btn" onclick="downloadConfig()">설정 파일 다운로드</button>
</div>
</div>

<div id="ai-consult-mount"></div>

<div class="footer">
<p>AI 워크플로우 셋업 v1.0 — 모든 처리는 브라우저 안에서만 이루어집니다.</p>
</div>
</div>

<script>
const configs={
data:{
name:'데이터 분석',
items:[
{title:'데이터 소스 연결',desc:'CSV, DB, API 등 데이터 소스 경로 설정',auto:true},
{title:'컬럼 매핑',desc:'분석에 필요한 컬럼 식별 및 타입 지정',auto:true},
{title:'결측치 처리 전략',desc:'제거/대체/보간 방법 선택',auto:true},
{title:'분석 목표 정의',desc:'탐색/예측/분류 중 목표 선택',auto:false},
{title:'시각화 템플릿',desc:'차트 유형 및 대시보드 레이아웃 설정',auto:true},
{title:'리포트 형식',desc:'PPT, PDF, HTML 중 산출물 형식 지정',auto:false}
],
config:`{
  "workflow": "data_analysis",
  "data_source": {
    "type": "csv",
    "path": "./data/",
    "encoding": "utf-8"
  },
  "preprocessing": {
    "missing_values": "auto_impute",
    "outlier_detection": true,
    "normalization": "minmax"
  },
  "analysis": {
    "objective": "exploratory",
    "methods": ["correlation", "distribution", "trend"]
  },
  "visualization": {
    "library": "plotly",
    "theme": "light",
    "charts": ["histogram", "scatter", "heatmap"]
  },
  "output": {
    "format": "html",
    "path": "./reports/"
  }
}`},
writing:{
name:'문서 작성',
items:[
{title:'문서 템플릿',desc:'보고사, 제안서, 기획서 등 템플릿 선택',auto:true},
{title:'톤 & 매너 설정',desc:'격식/비격식, 전문/일반 수준 지정',auto:true},
{title:'참조 자료 연결',desc:'기존 문서, 웹 자료 링크 연결',auto:false},
{title:'브랜드 가이드라인',desc:'로고, 컬러, 폰트 등 브랜드 요소 적용',auto:true},
{title:'문서 구조 자동 생성',desc:'목차 및 섹션 자동 생성',auto:true},
{title:'검수 체크리스트',desc:'맞춤법, 일관성, 완결성 검수 항목',auto:true}
],
config:`{
  "workflow": "document_writing",
  "template": {
    "type": "report",
    "sections": ["executive_summary", "background", "analysis", "recommendations", "appendix"]
  },
  "style": {
    "tone": "professional",
    "level": "expert",
    "language": "ko"
  },
  "brand": {
    "logo": null,
    "colors": ["#1a1a2e", "#16213e", "#0f3460"],
    "font": "Noto Sans KR"
  },
  "references": [],
  "quality_check": {
    "spell_check": true,
    "consistency": true,
    "completeness": true
  }
}`},
coding:{
name:'코드 생성',
items:[
{title:'프로젝트 구조',desc:'언어/프레임워크별 디렉터리 구조 자동 생성',auto:true},
{title:'코드 스타일 설정',desc:'린터, 포매터, 네이밍 컨벤션 적용',auto:true},
{title:'템플릿 코드',desc:'CRUD, API, 인증 등 기본 코드 생성',auto:true},
{title:'테스트 프레임워크',desc:'단위/통합/E2E 테스트 설정',auto:true},
{title:'CI/CD 파이프라인',desc:'빌드, 테스트, 배포 자동화 설정',auto:false},
{title:'문서 자동 생성',desc:'README, API 문서 자동 생성',auto:true}
],
config:`{
  "workflow": "code_generation",
  "project": {
    "language": "typescript",
    "framework": "react",
    "structure": "feature-based"
  },
  "code_style": {
    "linter": "eslint",
    "formatter": "prettier",
    "naming": "camelCase"
  },
  "templates": ["crud", "api", "auth"],
  "testing": {
    "unit": "jest",
    "integration": "supertest",
    "e2e": "playwright"
  },
  "ci_cd": {
    "platform": "github_actions",
    "stages": ["lint", "test", "build", "deploy"]
  }
}`},
marketing:{
name:'마케팅',
items:[
{title:'타깃 고객 정의',desc:'인구통계, 행동, 관심사 기반 페르소나 생성',auto:true},
{title:'채널 전략',desc:'SNS, 검색, 이메일 등 채널 믹스 설정',auto:true},
{title:'콘텐츠 캘린더',desc:'월별/주별 콘텐츠 일정 자동 생성',auto:true},
{title:'A/B 테스트 계획',desc:'변수, 표본 크기, 성공 지표 정의',auto:false},
{title:'성과 지표 설정',desc:'CTR, CVR, ROAS 등 KPI 대시보드',auto:true},
{title:'브랜드 메시지',desc:'핵심 메시지, 톤, 차별화 포인트 정의',auto:false}
],
config:`{
  "workflow": "marketing",
  "target_audience": {
    "persona": "auto_generated",
    "demographics": true,
    "behavior": true
  },
  "channels": {
    "primary": ["instagram", "naver"],
    "secondary": ["email", "youtube"]
  },
  "content_calendar": {
    "frequency": "weekly",
    "format": "csv"
  },
  "ab_testing": {
    "variables": ["headline", "image", "cta"],
    "sample_size": 1000,
    "metrics": ["ctr", "cvr"]
  },
  "kpi_dashboard": {
    "metrics": ["ctr", "cvr", "roas", "ltv"],
    "refresh": "daily"
  }
}`}
};

let currentType='data';

function selectType(type,btn){
currentType=btn?btn.dataset.type||type:type;
document.querySelectorAll('.work-btn').forEach(b=>b.classList.remove('active'));
if(btn)btn.classList.add('active');
else document.querySelectorAll('.work-btn')[['data','writing','coding','marketing'].indexOf(type)].classList.add('active');
renderChecklist();
}

function renderChecklist(){
const config=configs[currentType];
const list=document.getElementById('checklist');
list.innerHTML=config.items.map((item,i)=>`
<div class="check-item">
<input type="checkbox" id="check${i}" onchange="updateResult()">
<div class="text">
<div class="title">${item.title}<span class="badge ${item.auto?'auto':'manual'}">${item.auto?'자동':'수동'}</span></div>
<div class="desc">${item.desc}</div>
</div>
</div>`).join('');
updateResult();
}

function updateResult(){
const config=configs[currentType];
const checked=document.querySelectorAll('.check-item input:checked').length;
const total=config.items.length;
if(checked>0){
document.getElementById('result').classList.add('show');
document.getElementById('configOutput').textContent=config.config;
}else{
document.getElementById('result').classList.remove('show');
}
}

function downloadConfig(){
const config=configs[currentType];
const blob=new Blob([config.config],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='ai-workflow-config.json';
a.click();
URL.revokeObjectURL(url);
}

renderChecklist();
</script>
<script src="../_shared/10jo-ai.js"></script>
<script>
10joAI.attach({
  title: 'AI 업무 자동화 상담',
  placeholder: '예: 반복적인 이메일 업무를 자동화하려면 어떻게 하나요?',
  system: '당신은 업무 자동화 전문가입니다. 워크플로우 설계, 자동화 도구 관련 질문에 실용적으로 답변하세요.',
  localAnswer: function(q) {
    return '질문: ' + q + '\n\nAI 상담을 이용하시려면 NVIDIA NIM API 키를 입력해 주세요.\n키 발급: https://build.nvidia.com (무료, 카드 등록 불필요)\n\n키 없이도 위의 도구를 사용하실 수 있습니다.';
  }
});
</script>
</body>
</html>
