<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고정비 분석기 — 손익분기점과 개선 시나리오</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:16px;margin-bottom:24px}
.header h1{font-size:2em;margin-bottom:10px}
.header p{font-size:1.05em;opacity:.92}
.card{background:#fff;border-radius:12px;padding:28px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h2{font-size:1.2em;margin-bottom:16px;color:#1a1a1a}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-weight:600;margin-bottom:6px;color:#555}
.input-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1em}
.input-group input:focus{outline:none;border-color:#667eea}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.result{background:#f0f4ff;border-left:4px solid #667eea;padding:20px;border-radius:8px;margin-top:16px}
.result h3{color:#667eea;margin-bottom:10px}
.result .big{font-size:1.8em;font-weight:700;color:#1a1a1a;margin:8px 0}
.result .highlight{background:#fff3cd;padding:8px 12px;border-radius:6px;margin-top:10px;font-size:.95em}
.scenario{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.scenario-card{background:#f9f9f9;padding:16px;border-radius:8px;text-align:center}
.scenario-card .label{font-size:.85em;color:#888;margin-bottom:4px}
.scenario-card .value{font-size:1.3em;font-weight:700;color:#333}
.scenario-card .change{font-size:.85em;margin-top:4px}
.change.up{color:#28a745}
.change.down{color:#dc3545}
.btn{display:inline-block;padding:14px 32px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;margin-top:16px}
.btn:hover{background:#5a6fd6}
.footer{text-align:center;padding:30px;color:#999;font-size:.9em}
@media(max-width:768px){.input-row{grid-template-columns:1fr}.scenario{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>고정비 분석기</h1>
<p>매출·고정비·변동비를 입력하면 손익분기점과 개선 시나리오를 즉시 계산합니다</p>
</div>

<div class="card">
<h2>1. 매출 정보</h2>
<div class="input-row">
<div class="input-group">
<label for="monthlyRent">월 임대료 (원)</label>
<input type="number" id="monthlyRent" value="1000000" min="0" step="10000" oninput="calculate()">
</div>
<div class="input-group">
<label for="laborCost">월 인건비 (원)</label>
<input type="number" id="laborCost" value="2000000" min="0" step="10000" oninput="calculate()">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label for="otherFixed">기타 고정비 (원)</label>
<input type="number" id="otherFixed" value="500000" min="0" step="10000" oninput="calculate()">
</div>
<div class="input-group">
<label for="variableRate">변동비율 (%)</label>
<input type="number" id="variableRate" value="30" min="0" max="100" step="1" oninput="calculate()">
</div>
</div>
<div class="input-group">
<label for="avgPrice">평균 객단가 (원)</label>
<input type="number" id="avgPrice" value="15000" min="0" step="1000" oninput="calculate()">
</div>
</div>

<div class="card">
<h2>2. 계산 결과</h2>
<div class="result" id="result">
<h3>손익분기점</h3>
<div class="big" id="breakeven">—</div>
<p id="breakevenDesc">위에서 정보를 입력하면 자동으로 계산됩니다.</p>
<div class="highlight" id="highlight"></div>
</div>

<div class="scenario" id="scenario">
<div class="scenario-card">
<div class="label">현재 월 고정비</div>
<div class="value" id="totalFixed">—</div>
</div>
<div class="scenario-card">
<div class="label">변동비율</div>
<div class="value" id="varRate">—</div>
</div>
<div class="scenario-card">
<div class="label">손익분기 매출</div>
<div class="value" id="beSales">—</div>
</div>
<div class="scenario-card">
<div class="label">손익분기 객수</div>
<div class="value" id="beCustomers">—</div>
</div>
</div>
</div>

<div class="card">
<h2>3. 개선 시나리오</h2>
<div class="scenario">
<div class="scenario-card">
<div class="label">임대료 20% 절감 시</div>
<div class="value" id="saveRent">—</div>
<div class="change up" id="saveRentChange"></div>
</div>
<div class="scenario-card">
<div class="label">인건비 15% 절감 시</div>
<div class="value" id="saveLabor">—</div>
<div class="change up" id="saveLaborChange"></div>
</div>
<div class="scenario-card">
<div class="label">변동비 5%p 절감 시</div>
<div class="value" id="saveVar">—</div>
<div class="change up" id="saveVarChange"></div>
</div>
<div class="scenario-card">
<div class="label">객단가 10% 인상 시</div>
<div class="value" id="raisePrice">—</div>
<div class="change up" id="raisePriceChange"></div>
</div>
</div>
</div>

<div id="ai-consult-mount"></div>

<div class="footer">
<p>고정비 분석기 v1.0 — 계산 결과는 예상치이며 실제 사업 상황과 다를 수 있습니다.</p>
</div>
</div>

<script>
function calculate(){
  const rent=parseFloat(document.getElementById('monthlyRent').value)||0;
  const labor=parseFloat(document.getElementById('laborCost').value)||0;
  const other=parseFloat(document.getElementById('otherFixed').value)||0;
  const varRate=parseFloat(document.getElementById('variableRate').value)||0;
  const avgPrice=parseFloat(document.getElementById('avgPrice').value)||0;

  const totalFixed=rent+labor+other;
  const contributionRate=100-varRate;
  const breakevenSales=contributionRate>0?totalFixed/(contributionRate/100):0;
  const breakevenCustomers=avgPrice>0?breakevenSales/avgPrice:0;

  document.getElementById('totalFixed').textContent=totalFixed.toLocaleString()+'원';
  document.getElementById('varRate').textContent=varRate+'%';
  document.getElementById('beSales').textContent=breakevenSales.toLocaleString()+'원';
  document.getElementById('beCustomers').textContent=Math.ceil(breakevenCustomers).toLocaleString()+'명';
  document.getElementById('breakeven').textContent=breakevenSales.toLocaleString()+'원';
  document.getElementById('breakevenDesc').textContent='월 매출이 '+breakevenSales.toLocaleString()+'원을 넘어야 이익이 발생합니다. 하루 평균 '+Math.ceil(breakevenCustomers/30).toLocaleString()+'명의 객단가가 필요합니다.';

  // 시나리오
  const saveRentBE=contributionRate>0?(totalFixed-rent*0.2)/(contributionRate/100):0;
  const saveLaborBE=contributionRate>0?(totalFixed-labor*0.15)/(contributionRate/100):0;
  const saveVarBE=contributionRate>5?totalFixed/((contributionRate+5)/100):0;
  const raisePriceBE=contributionRate>0?totalFixed/(contributionRate/100)*0.909:0;

  document.getElementById('saveRent').textContent=saveRentBE.toLocaleString()+'원';
  document.getElementById('saveRentChange').textContent='▼ '+((breakevenSales-saveRentBE)/breakevenSales*100).toFixed(1)+'% 감소';
  document.getElementById('saveLabor').textContent=saveLaborBE.toLocaleString()+'원';
  document.getElementById('saveLaborChange').textContent='▼ '+((breakevenSales-saveLaborBE)/breakevenSales*100).toFixed(1)+'% 감소';
  document.getElementById('saveVar').textContent=saveVarBE.toLocaleString()+'원';
  document.getElementById('saveVarChange').textContent='▼ '+((breakevenSales-saveVarBE)/breakevenSales*100).toFixed(1)+'% 감소';
  document.getElementById('raisePrice').textContent=raisePriceBE.toLocaleString()+'원';
  document.getElementById('raisePriceChange').textContent='▼ '+((breakevenSales-raisePriceBE)/breakevenSales*100).toFixed(1)+'% 감소';

  // 하이라이트
  let highlight='';
  if(varRate>50)highlight='변동비율이 50%를 초과합니다. 원가 절감 또는 객단가 인상이 시급합니다.';
  else if(totalFixed>breakevenSales*0.7)highlight='고정비 부담이 매출 대비 높습니다. 임대료·인건비 구조조정을 권장합니다.';
  else if(contributionRate<30)highlight='공헌이익률이 30% 미만입니다. 가격 정책 재검토가 필요합니다.';
  else highlight='현재 구조는 양호합니다. 추가 매출 성장에 집중하세요.';
  document.getElementById('highlight').textContent=highlight;
}
calculate();
</script>
<script src="../_shared/10jo-ai.js"></script>
<script>
10joAI.attach({
  title: 'AI 고정비 절감 상담',
  placeholder: '예: 소규모 사업장인데 고정비를 줄일 방법이 있을까요?',
  system: '당신은 소상공인 경영 컨설턴트입니다. 고정비 절감, 비용 구조 개선 관련 질문에 실용적으로 답변하세요.',
  localAnswer: function(q) {
    return '질문: ' + q + '\n\nAI 상담을 이용하시려면 NVIDIA NIM API 키를 입력해 주세요.\n키 발급: https://build.nvidia.com (무료, 카드 등록 불필요)\n\n키 없이도 위의 도구를 사용하실 수 있습니다.';
  }
});
</script>
</body>
</html>
